<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elbanna.xyz</title>

<!-- SEO -->
<meta name="description" content="Elbanna Treasure & Company - Key West Florida">
<meta name="keywords" content="Elbanna, Treasure, Key West, Florida, Elbanna.xyz">
<meta name="author" content="Elbanna">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: linear-gradient(180deg, #0b1c2c, #061018);
    color: white;
    font-family: 'Playfair Display', serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    text-align: center;
}

/* Container */
.container {
    padding: 20px;
    max-width: 900px;
    width: 100%;
}

/* Domain Title */
.domain {
    font-size: clamp(2rem, 6vw, 4rem);
    letter-spacing: 3px;
    margin-bottom: 30px;
}

/* Logo */
.logo img {
    max-width: 420px;
    width: 90%;
    height: auto;
    transition: transform 0.4s ease;
}

.logo img:hover {
    transform: scale(1.05);
}

/* Subtitle */
.subtitle {
    margin-top: 25px;
    font-size: clamp(1rem, 3vw, 1.4rem);
    opacity: 0.85;
}

/* Footer */
.footer {
    position: fixed;
    bottom: 15px;
    width: 100%;
    font-size: 0.9rem;
    opacity: 0.6;
}

/* Mobile Optimization */
@media (max-width: 600px) {
    body {
        height: auto;
        padding-top: 60px;
        padding-bottom: 60px;
    }
}

</style>
</head>

<body>

<div class="container">

    <div class="domain">
        elbanna.xyz
    </div>

    <div class="logo">
        <!-- Replace with your logo filename -->
        <img src="elbanna_treasure_company_logo_transparent.png" alt="Elbanna Treasure & Company Logo">
    </div>

    <div class="subtitle">
        Elbanna Treasure & Company<br>
        Key West, Florida
    </div>

</div>

<div class="footer">
    © 2026 Elbanna.xyz — All Rights Reserved
</div>

</body>
</html>
