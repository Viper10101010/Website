<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Elbanna Enterprises</title>

<style>

/* Page Reset */
body{
    margin:0;
    background:#ffffff;
    font-family:Arial, Helvetica, sans-serif;
    color:#000;
    display:flex;
    min-height:100vh;
}

/* Red Vertical Line */
.left-line{
    width:3px;
    background:#cc0000;
}

/* Content Area */
.content{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
}

/* Text Styling */
h1{
    font-size:3rem;
    font-weight:900;
    margin:0;
}

.email{
    margin-top:15px;
    font-size:1.2rem;
}

.email a{
    color:#000;
    text-decoration:none;
}

.email a:hover{
    text-decoration:underline;
}

/* Mobile Responsive */
@media(max-width:600px){
    h1{
        font-size:2rem;
    }
    .email{
        font-size:1rem;
    }
}

</style>
</head>

<body>

<div class="left-line"></div>

<div class="content">
    <div>
        <h1>Elbanna Enterprises</h1>
        <div class="email">
            <a href="mailto:info@elbanna.xyz">info@elbanna.xyz</a>
        </div>
    </div>
</div>

</body>
</html>
